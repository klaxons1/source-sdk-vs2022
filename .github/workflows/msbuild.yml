name: Build Source SDK 2013 SP (Release)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build SP Client and Server DLLs
    runs-on: windows-2022
    env:
      # Fix duplicate _wcsdup and suppress warnings
      CL: /D_WCSDUP_DEFINED /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_WARNINGS

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Cache MSBuild outputs
      - name: Cache MSBuild outputs
        uses: actions/cache@v4
        with:
          path: |
            sp/src/game/server/Release
            sp/src/game/client/Release
            sp/src/intermediate
          key: ${{ runner.os }}-msbuild-${{ hashFiles('**/*.vpc', '**/*.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-

      # 4. Fix VPC Registry Error
      - name: Fix VPC Registry Error
        shell: cmd
        run: |
          reg add "HKLM\SOFTWARE\Classes\VisualStudio.Launcher.sln\Shell\Open\Command" /ve /t REG_SZ /d "\"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.exe\" \"%%1\"" /f
          reg add "HKLM\SOFTWARE\Wow6432Node\Microsoft\VisualStudio\10.0\Projects\{8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942}" /v "DefaultProjectExtension" /t REG_SZ /d "vcxproj" /f

      # 5. Generate Visual Studio Projects
      - name: Generate Visual Studio Projects
        shell: cmd
        run: |
          cd sp\src
          call createallprojects.bat

      # 6. Build Projects (Release Win32)
      - name: Build Projects (Release Win32)
        shell: cmd
        run: |
          cd sp\src
          msbuild game\server\server_episodic.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
          msbuild game\client\client_episodic.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # 7. Collect DLLs
      - name: Collect DLLs
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build_output
          
          Get-ChildItem -Path "sp/src/game" -Filter "client.dll" -Recurse | Copy-Item -Destination "build_output\" -Force
          Get-ChildItem -Path "sp/src/game" -Filter "server.dll" -Recurse | Copy-Item -Destination "build_output\" -Force
          
          if (-not (Test-Path "build_output\client.dll") -or -not (Test-Path "build_output\server.dll")) {
            Write-Error "Compiled DLLs not found in output folders!"
            exit 1
          }

      # 8. Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-sdk-sp-release-binaries
          path: build_output/
