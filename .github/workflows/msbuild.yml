name: Build Source SDK 2013 SP (Release)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build SP Client and Server DLLs
    runs-on: windows-2022

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настройка MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Кэширование промежуточных файлов сборки (.obj, .pch)
      - name: Cache MSBuild outputs
        uses: actions/cache@v4
        with:
          path: |
            sp/src/game/server/Release
            sp/src/game/client/Release
            sp/src/intermediate
          key: ${{ runner.os }}-msbuild-${{ hashFiles('**/*.vpc', '**/*.vcxproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-

      # 4. Решение ошибки VPC (Добавление RegKey для vcxproj)
      - name: Fix VPC Registry Error
        shell: cmd
        run: |
          reg add "HKLM\SOFTWARE\Classes\VisualStudio.Launcher.sln\Shell\Open\Command" /ve /t REG_SZ /d "\"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.exe\" \"%%1\"" /f
          reg add "HKLM\SOFTWARE\Wow6432Node\Microsoft\VisualStudio\10.0\Projects\{8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942}" /v "DefaultProjectExtension" /t REG_SZ /d "vcxproj" /f

      # 5. Гарантированное исправление ошибки C2084 (_wcsdup) для любых переносов строк
      - name: Patch memoverride.cpp for VS2022
        shell: powershell
        run: |
          $filePath = "sp\src\public\tier0\memoverride.cpp"
          if (Test-Path $filePath) {
              $lines = Get-Content $filePath
              
              # Ищем индекс строки, где объявляется wchar_t *__cdecl _wcsdup
              $targetIndex = -1
              for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match "wchar_t\s+\*__cdecl\s+_wcsdup") {
                      $targetIndex = $i
                      break
                  }
              }
              
              if ($targetIndex -ne -1) {
                  Write-Host "Найдено объявление _wcsdup на строке $($targetIndex + 1). Оборачиваем в директивы препроцессора..."
                  
                  # Оборачиваем саму функцию и её тело (следующие 3 строки) в проверку версии MSVC
                  $lines[$targetIndex] = "#if _MSC_VER < 1930`n" + $lines[$targetIndex]
                  $lines[$targetIndex + 3] = $lines[$targetIndex + 3] + "`n#endif"
                  
                  Set-Content -Path $filePath -Value $lines
                  Write-Host "Файл успешно модифицирован!"
              } else {
                  Write-Warning "Не удалось найти сигнатуру _wcsdup в файле."
              }
          } else {
              Write-Error "Файл memoverride.cpp отсутствует!"
              exit 1
          }

      # 6. Генерация .sln файлов через VPC
      - name: Generate Visual Studio Projects
        shell: cmd
        run: |
          cd sp\src
          call createallprojects.bat

      # 7. Компиляция конкретно проектов Client и Server (Win32 Release)
      - name: Build Projects (Release Win32)
        shell: cmd
        run: |
          cd sp\src
          msbuild game\server\server_episodic.vcxproj /p:Configuration=Release /p:Platform=Win32 /m
          msbuild game\client\client_episodic.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      # 8. Сбор готовых DLL через PowerShell с поиском по маске
      - name: Collect DLLs into one folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build_output
          
          Get-ChildItem -Path "sp/src/game" -Filter "client.dll" -Recurse | Copy-Item -Destination "build_output\" -Force
          Get-ChildItem -Path "sp/src/game" -Filter "server.dll" -Recurse | Copy-Item -Destination "build_output\" -Force
          
          if (-not (Test-Path "build_output\client.dll") -or -not (Test-Path "build_output\server.dll")) {
            Write-Error "Скомпилированные DLL не найдены в выходных папках!"
            exit 1
          }

      # 9. Сохранение папки с DLL в артефакты сборки GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-sdk-sp-release-binaries
          path: build_output/
