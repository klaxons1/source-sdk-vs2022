name: Build Source SDK 2013 SP (Release)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build SP Client and Server DLLs
    runs-on: windows-2022

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настройка MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Генерация .sln файлов через VPC
      - name: Generate Visual Studio Projects
        shell: cmd
        run: |
          cd sp\src
          call createallprojects.bat

      # 4. Компиляция решения в конфигурации Release (Platform: Win32)
      - name: Build Solution (Release)
        shell: cmd
        run: |
          cd sp\src
          msbuild everything.sln /p:Configuration=Release /p:Platform=Win32 /m

      # 5. Копирование готовых DLL в одну общую папку
      - name: Collect DLLs into one folder
        shell: cmd
        run: |
          mkdir build_output
          xcopy "sp\src\game\client\Release\client.dll" "build_output\" /Y
          xcopy "sp\src\game\server\Release\server.dll" "build_output\" /Y

      # 6. Сохранение папки с DLL в артефакты сборки GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-sdk-sp-release-binaries
          path: build_output/
