name: Build Source SDK 2013 SP (Release)

on:
  push:
    branches:
      - master # Сборка запускается при пуше в master (или укажите вашу ветку)
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build SP Client and Server DLLs
    runs-on: windows-2022 # Используем окружение с Visual Studio 2022

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настройка MSBuild в PATH окружения
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Генерация .sln и .vcxproj файлов через VPC
      - name: Generate Visual Studio Projects
        shell: cmd
        run: |
          cd sp\src
          :: Запуск батника для генерации проекта everything.sln
          call createallprojects.bat

      # 4. Компиляция решения в конфигурации Release
      - name: Build Solution (Release)
        shell: cmd
        run: |
          cd sp\src
          :: Компилируем только client и server проекты (или everything.sln целиком)
          msbuild everything.sln /p:Configuration=Release /p:Platform=Win32 /m

      # 5. Сохранение скомпилированных бинарников (client.dll и server.dll) в артефакты
      - name: Upload Artifacts
        uses: actions/artifacts-upload@v4
        with:
          name: source-sdk-sp-release-binaries
          path: |
            sp/src/game/client/Release/*.dll
            sp/src/game/server/Release/*.dll
